<!DOCTYPE html>
<html lang="en" manifest="run/css.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1b">
    <meta name="description" content="G-Playstation PS4 HEN firmware host for versions 10.00–11.02.">
    <title>G-Playstation PS4 HEN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="highlight">G-Playstation</span>
                <span class="ps4-text">PS4</span>
                <span class="hen-text">HEN</span>
            </h1>
            <div class="subtitle">Firmware Host</div>
            <div class="version-badge">10.00 — 11.02</div>
        </header>
        
        <hr class="separator">

        <div id="menu">
            <h2 class="fw-title">System check</h2>
            <p class="fw-range">Supported firmware <span class="range-highlight">10.00 — 11.02</span></p>
            
            <div class="status-bar">
                <span id="msgs" class="status-text loading">Checking your console…</span>
            </div>

            <footer>
                <p class="credit">Hosted by <span class="credit-link">gustiyan_iz</span></p>
                <p class="thanks">Original project by Mustafa · Thanks to all scene developers</p>
            </footer>
        </div>
    </div>

    <script>
        var msgs = document.getElementById('msgs');

        var hostStarted = false;

        function updateStatus(msg) {
            msgs.innerHTML = msg;
        }

        function openHost() {
            if (hostStarted) return;
            hostStarted = true;
            updateStatus('Offline cache ready. Loading host…');
            setTimeout(function() {
                window.location.replace('run/index.html');
            }, 700);
        }

        function prepareCacheAndOpenHost() {
            var appCache = window.applicationCache;

            if (!appCache) {
                openHost();
                return;
            }

            appCache.addEventListener('checking', function() {
                updateStatus('Checking offline cache…');
            }, false);

            appCache.addEventListener('downloading', function() {
                updateStatus('Saving host for offline use…');
            }, false);

            appCache.addEventListener('progress', function(event) {
                if (event.total) {
                    updateStatus('Saving offline cache: ' + Math.round(event.loaded / event.total * 100) + '%');
                }
            }, false);

            appCache.addEventListener('cached', openHost, false);
            appCache.addEventListener('noupdate', openHost, false);
            appCache.addEventListener('updateready', function() {
                try { appCache.swapCache(); } catch (error) {}
                openHost();
            }, false);

            appCache.addEventListener('error', function() {
                updateStatus('Cache update unavailable. Opening saved host…');
                setTimeout(openHost, 900);
            }, false);

            if (appCache.status === appCache.IDLE) {
                setTimeout(openHost, 1800);
            }
        }

        // التحقق من الجهاز والإصدار
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        // بدء التشغيل التلقائي
        document.addEventListener("DOMContentLoaded", function() {
            if (!isPS4) {
                updateStatus('Open this page from a PS4 browser (firmware 10.00–11.02).');
                msgs.className = 'status-text error';
                return;
            }

            if (fwNum >= 10.00 && fwNum <= 11.02) {
                updateStatus('PS4 firmware ' + fwVersion + ' detected');
                prepareCacheAndOpenHost();
            } else {
                updateStatus('Firmware ' + fwVersion + ' is not supported. Requires 10.00–11.02.');
                msgs.className = 'status-text error';
            }
        });
    </script>
</body>
</html>
